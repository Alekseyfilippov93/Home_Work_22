{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-body text-center">
                    <h3 class="card-title text-danger">Удаление записи</h3>
                    <p class="card-text">Вы действительно хотите удалить запись <strong>"{{ object.title }}"</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
                        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

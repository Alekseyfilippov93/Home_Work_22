{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <article>
                <h1 class="display-4">{{ object.title }}</h1>
                <p class="text-muted">Опубликовано: {{ object.created_at|date:"d.m.Y H:i" }} | Просмотров: {{ object.views_count }}</p>
                
                {% if object.image %}
                    <img src="{{ object.image.url }}" class="img-fluid rounded mb-4" alt="{{ object.title }}">
                {% endif %}
                
                <div class="lead mb-5">
                    {{ object.content|linebreaks }}
                </div>
                
                <hr>
                <div class="d-flex gap-2">
                    <a href="{% url 'blog:list' %}" class="btn btn-outline-primary">Назад к списку</a>
                    <a href="{% url 'blog:edit' object.pk %}" class="btn btn-warning">Редактировать</a>
                    <a href="{% url 'blog:delete' object.pk %}" class="btn btn-danger">Удалить</a>
                </div>
            </article>
        </div>
    </div>
</div>
{% endblock %}

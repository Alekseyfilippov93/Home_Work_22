{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if object.image %}
            <img src="{{ object.image.url }}" class="img-fluid rounded" alt="{{ object.name }}">
        {% else %}
            <img src="/media/no_image.png" class="img-fluid rounded" alt="Нет изображения">
        {% endif %}
    </div>

    <div class="col-md-6">
        <h1 class="display-5 fw-bold">{{ object.name }}</h1>
        <p class="text-muted">Категория: {{ object.category.name }}</p>
        <hr>
        <h3 class="text-primary">{{ object.price }} руб.</h3>
        <p class="mt-4">{{ object.description }}</p>

        <div class="mt-5">
            <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Назад к списку товаров</a>
        </div>
    </div>
</div>
{% endblock %}

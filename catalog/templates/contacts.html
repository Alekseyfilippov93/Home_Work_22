{% extends 'base.html' %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Контакты</h1>
    <p class="lead">Свяжитесь с нами любым удобным способом</p>
</div>

<div class="container">
    <div class="row">
        <div class="col-md-6">
            <h3>Наш адрес</h3>
            <p>г. Москва, ул. Примерная, д. 10</p>
            <p>Телефон: +7 (999) 000-00-00</p>
            <p>Email: info@skystore.ru</p>
        </div>

        <div class="col-md-6">
            <h3>Оставьте заявку</h3>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="text" name="phone" class="form-control" id="phone" placeholder="Введите телефон">
                </div>
                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea name="message" class="form-control" id="message" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Отправить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

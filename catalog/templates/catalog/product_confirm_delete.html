{% extends 'catalog/base.html' %}

{% block content %}
<div class="col-6 offset-3">
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <p>Вы уверены, что хотите удалить "{{ object.name }}"?</p>
                <button type="submit" class="btn btn-danger">Подтвердить</button>
                <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

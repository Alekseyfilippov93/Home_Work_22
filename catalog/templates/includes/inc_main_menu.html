<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="my-2 my-md-0 mr-md-3">
        <a class="p-2 text-dark" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 text-dark" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 text-dark" href="{% url 'blog:list' %}">Блог</a>

        {% if user.is_authenticated %}
            <span class="p-2 text-muted">| {{ user.email }}</span>
            <form action="{% url 'users:logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm ml-2">Выйти</button>
            </form>
        {% else %}
            <a class="p-2 text-dark" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-outline-primary ml-2" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>

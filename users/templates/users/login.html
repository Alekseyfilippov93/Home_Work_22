{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <h2>Вход в аккаунт</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p>Еще нет аккаунта? <a href="{% url 'users:register' %}">Регистрация</a></p>
</div>
{% endblock %}
